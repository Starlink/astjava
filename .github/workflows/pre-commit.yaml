name: Run pre-commit

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Java hooks run Maven, which needs JDK 21 to 26 (see CLAUDE.md).
      # Maven itself is preinstalled on the runner.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # prek-action publishes no moving major tags, so pin a release by SHA.
      # prek finds or downloads the Python its Python hooks need.
      - name: Run prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          extra-args: --all-files
